name: Sync Goodreads to Notion

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Sync RSS
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LIBRARY_DATABASE_ID: ${{ secrets.NOTION_LIBRARY_DATABASE_ID }}
          NOTION_READING_LIST_DATABASE_ID: ${{ secrets.NOTION_READING_LIST_DATABASE_ID }}
          GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}
          GOODREADS_RSS_KEY: ${{ secrets.GOODREADS_RSS_KEY }}
          READING_YEAR: "2026"
        run: grnotion sync-rss
