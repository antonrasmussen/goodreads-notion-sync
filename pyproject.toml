[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grnotion"
version = "0.1.0"
description = "Sync a Goodreads library into Notion (full mirror + 2026 reading list)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "notion-client>=3.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.9.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "respx>=0.21.0",
]

[project.scripts]
grnotion = "grnotion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["grnotion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
